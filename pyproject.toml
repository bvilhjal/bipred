[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bipred"
dynamic = ["version"]                # single-sourced from bipred.__version__
description = "Bivariate (two-trait) LDpred: joint genetic-correlation, heritability, polygenic-overlap inference and prediction, built on ldpred3"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bjarni Vilhjálmsson" }]
# The 0.5 line supplies the public cache/subsetting interoperability boundary
# and ldpred3.shim, the published code-level surface the seam binds the Numba
# decorators and validators through. The floor moved 0.5.3 -> 0.5.5 when
# BivariateResult.write_weights started passing `sd_source=` to
# ldpred3.interop.write_weights: that keyword does not exist before 0.5.5.dev0,
# so the older floor would have installed cleanly and then raised TypeError on
# the first weight write. A minor-version ceiling still guards the private
# sampler/LDSC borrowings isolated in bipred/_ldpred3_compat.py. Neither package
# is on PyPI yet; install from the sibling checkout or authenticated Git source
# documented in README.
dependencies = ["numpy>=1.20", "ldpred3>=0.5.5.dev0,<0.6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/bvilhjal/bipred"
Repository = "https://github.com/bvilhjal/bipred"
Issues = "https://github.com/bvilhjal/bipred/issues"

[project.scripts]
bipred = "bipred.cli:main"

[project.optional-dependencies]
fast = ["ldpred3[fast]>=0.5.5.dev0,<0.6"]
sim = ["msprime>=1.3"]          # simulation only; plots are intentionally optional
bench = ["msprime>=1.3", "matplotlib>=3.7"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
test = ["pytest>=7"]
lint = ["ruff>=0.5"]            # pyflakes-style lint gate (see [tool.ruff])

[tool.setuptools]
packages = ["bipred"]

[tool.setuptools.dynamic]
version = { attr = "bipred.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Marker taxonomy for selective CI, mirroring ldpred3/gwfm so the legs read the
# same way. tests/test_webapp.py is tagged slow: it runs real subprocess fits.
markers = [
    "slow: heavy tests (multi-chain inference, end-to-end pipeline, large sims); skipped on the fast CI leg",
    "integration: end-to-end tests that exercise a whole pipeline, not a single unit",
    "external: needs an external tool not installed in CI (msprime, R/SBayesRC, LDAK, GCTB)",
    "numba: specifically exercises or requires the Numba JIT path",
]

[tool.ruff]
# Lint for real defects, not style: like ldpred3, the codebase uses compact
# multi-statement lines (E702) and long lines, so enforce only pyflakes (F).
target-version = "py39"

[tool.ruff.lint]
select = ["F"]
