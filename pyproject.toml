[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bipred"
dynamic = ["version"]                # single-sourced from bipred.__version__
description = "Bivariate (two-trait) LDpred: joint genetic-correlation, heritability, polygenic-overlap inference and prediction, built on ldpred3"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bjarni Vilhjálmsson" }]
# The 0.5 floor supplies the public cache/subsetting interoperability boundary.
# A minor-version ceiling still guards the private sampler/LDSC seam isolated in
# bipred/_ldpred3_compat.py. Neither package is on PyPI yet; install from the
# sibling checkout or authenticated Git source documented in README.
dependencies = ["numpy>=1.20", "ldpred3>=0.5.0.dev1,<0.6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/bvilhjal/bipred"
Repository = "https://github.com/bvilhjal/bipred"
Issues = "https://github.com/bvilhjal/bipred/issues"

[project.scripts]
bipred = "bipred.cli:main"

[project.optional-dependencies]
fast = ["ldpred3[fast]>=0.5.0.dev1,<0.6"]
sim = ["msprime>=1.3"]          # simulation only; plots are intentionally optional
bench = ["msprime>=1.3", "matplotlib>=3.7"]
test = ["pytest>=7"]
lint = ["ruff>=0.5"]            # pyflakes-style lint gate (see [tool.ruff])

[tool.setuptools]
packages = ["bipred"]

[tool.setuptools.dynamic]
version = { attr = "bipred.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Lint for real defects, not style: like ldpred3, the codebase uses compact
# multi-statement lines (E702) and long lines, so enforce only pyflakes (F).
target-version = "py39"

[tool.ruff.lint]
select = ["F"]
