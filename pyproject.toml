[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bipred"
dynamic = ["version"]                # single-sourced from bipred.__version__
description = "Bivariate (two-trait) LDpred: joint genetic-correlation, heritability, polygenic-overlap inference and prediction, built on ldpred3"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bjarni Vilhjálmsson" }]
# The 0.6.6 line exports BUILD_MISMATCH_FRACTION, progress= on auto-infer,
# D8 spectral flooring, and the float32 DENTIST Schur path. Those landed in
# source that still called itself 0.6.5, so a 0.5.5.dev0 floor could install
# a pin that then ImportError'd. Compatibility with the 0.6 line is exercised
# by the bipred and SMARTpred suites; a minor-version ceiling still guards the
# private sampler/LDSC borrowings isolated in bipred/_ldpred3_compat.py. Neither
# package is on PyPI yet; install from the sibling checkout or authenticated
# Git source documented in README.
dependencies = ["numpy>=1.20", "ldpred3>=0.6.6,<0.7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/bvilhjal/bipred"
Repository = "https://github.com/bvilhjal/bipred"
Issues = "https://github.com/bvilhjal/bipred/issues"

[project.scripts]
bipred = "bipred.cli:main"

[project.optional-dependencies]
fast = ["ldpred3[fast]>=0.6.6,<0.7"]
sim = ["msprime>=1.3"]          # simulation only; plots are intentionally optional
bench = ["msprime>=1.3", "matplotlib>=3.7"]
test = ["pytest>=7"]
lint = ["ruff>=0.5"]            # pyflakes-style lint gate (see [tool.ruff])

[tool.setuptools]
packages = ["bipred"]

[tool.setuptools.dynamic]
version = { attr = "bipred.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Marker taxonomy for selective CI, mirroring ldpred3/gwfm so the legs read the
# same way.
markers = [
    "slow: heavy tests (multi-chain inference, end-to-end pipeline, large sims); skipped on the fast CI leg",
    "integration: end-to-end tests that exercise a whole pipeline, not a single unit",
    "external: needs an external tool not installed in CI (msprime, R/SBayesRC, LDAK, GCTB)",
    "numba: specifically exercises or requires the Numba JIT path",
]

[tool.ruff]
# Lint for real defects, not style: like ldpred3, the codebase uses compact
# multi-statement lines (E702) and long lines, so enforce only pyflakes (F).
target-version = "py39"

[tool.ruff.lint]
select = ["F"]
