# Trait registry for studies/.
#
# One entry per dataset, so adding a trait is a data edit rather than a code
# edit. Study configs reference traits by key; nothing here is study-specific.
#
# Column layouts are named vintages rather than six inline keyword arguments,
# because public releases use at least three conventions and the difference is
# a property of the file, not of the analysis.
#
# `quirks` records defects that must be corrected before use. Each one below
# was found the hard way; see datasets.md for how.

[columns.gwas_catalog_hm]
# GWAS Catalog harmonised, PMID-prefixed filenames.
rsid = "hm_rsid"
effect_allele = "hm_effect_allele"
other_allele = "hm_other_allele"
effect = "hm_beta"
se = "standard_error"
frequency = "hm_effect_allele_frequency"

[columns.gwas_catalog_v2]
# GWAS Catalog harmonised, accession-named filenames.
rsid = "rsid"
effect_allele = "effect_allele"
other_allele = "other_allele"
effect = "beta"
se = "standard_error"
frequency = "effect_allele_frequency"

[columns.glgc_2013]
rsid = "rsid"
effect_allele = "A1"
other_allele = "A2"
effect = "beta"
se = "se"
n = "N"
frequency = "Freq.A1.1000G.EUR"


