name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  # Weekly reproducibility check of the compatible sibling pin, plus manual runs.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

env:
  # Exact compatible sibling revision. Pin the tested 0.6 release rather than
  # following the moving default branch. Archived real-data benchmarks retain
  # their own immutable 0.4.5 source pin in benchmarks/real_data_inputs.py.
  LDPRED3_REV: "d5570538d934e19aa7d6366176a1dfd27f3ee78d"
  # The floor bipred supports -- NOT a prediction about what `master` is at.
  # Those are different facts, and the workflow used to assert the installed
  # version equalled this one, which held only while master sat exactly on the
  # floor and broke the moment LDpred3 moved to 0.5.4, with no bipred change at
  # fault. The verify step below checks range membership instead, so this value
  # tracks pyproject and nothing else.
  LDPRED3_FLOOR: "0.7.6"
  # ldpred3 lives in a private repo, so the runner's default GITHUB_TOKEN (scoped
  # to this repo only) cannot clone it. Provide a repo/organization secret
  # LDPRED3_FOR_BIPRED (or LDPRED3_TOKEN) — a PAT or fine-grained token with
  # read access to
  # bvilhjal/ldpred3 — and the "Authenticate to private ldpred3" steps below wire
  # it into git so `pip install git+https://…` succeeds. Without it, those steps
  # now fail loudly and name the missing secret, rather than letting a pip
  # subprocess report `could not read Username` a few steps later.
  # Deliberately NOT mirrored into workflow-level env: a secret read that way is
  # invisible to `if:` expressions, which is what made this silently skip.

jobs:
  lint:
    runs-on: ubuntu-latest
    name: ruff (pyflakes)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Linting source files does not require importing or resolving ldpred3.
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: Lint (pyflakes-only; see [tool.ruff] in pyproject)
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
        numba: ["with-numba", "no-numba"]
    name: py${{ matrix.python-version }} / ${{ matrix.numba }}
    env:
      # Pin BLAS / OMP threads so numeric results are deterministic.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Rewrite github.com clones to carry the token so pip can reach the private
      # ldpred3 repo. No-op (and the install fails as before) when the secret is
      # unset. `git config --global` persists for the rest of the job.
      - name: Authenticate to private ldpred3
        shell: bash
        env:
          TOKEN: ${{ secrets.LDPRED3_FOR_BIPRED || secrets.LDPRED3_TOKEN }}
        run: |
          # The guard lives in bash, not in an `if:` expression. A secret piped
          # through workflow-level `env` reads as empty to the expression
          # evaluator, so `if: env.LDPRED3_TOKEN != ''` skipped this step even
          # with the secret set -- and the only symptom was `could not read
          # Username` from a pip subprocess several steps later. Say it plainly
          # instead.
          if [ -z "$TOKEN" ]; then
            echo "::error::No ldpred3 token secret is set on this repository."
            echo "ldpred3 is private, so every install below will fail."
            echo "Add a token with read access to bvilhjal/ldpred3:"
            echo "  printf %s '<token>' | gh secret set LDPRED3_FOR_BIPRED --repo bvilhjal/bipred"
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          # Windows only in effect, harmless elsewhere. ldpred3's benchmark
          # archive carries a 187-character path
          # (benchmarks/results/<run>/source/<sha>/untracked/...), and pip clones
          # into a ~95-character temp directory, so checkout overruns MAX_PATH
          # and fails with "Filename too long" *after* a successful clone.
          git config --global core.longpaths true

      # bipred depends on ldpred3, which is not on PyPI yet — install it from git
      # so the shared LD / sampler internals are importable.
      - name: Install ldpred3 (dependency, with Numba)
        if: matrix.numba == 'with-numba'
        run: pip install "ldpred3[fast] @ git+https://github.com/bvilhjal/ldpred3.git@${{ env.LDPRED3_REV }}"

      - name: Install ldpred3 (dependency, pure NumPy)
        if: matrix.numba == 'no-numba'
        run: |
          pip uninstall -y numba llvmlite
          pip install "ldpred3 @ git+https://github.com/bvilhjal/ldpred3.git@${{ env.LDPRED3_REV }}"

      - name: Install bipred (with Numba)
        if: matrix.numba == 'with-numba'
        run: pip install -e ".[test,fast]"

      - name: Install bipred (pure NumPy, no Numba)
        if: matrix.numba == 'no-numba'
        run: pip install -e ".[test]"

      # Read the range back from bipred's own installed metadata rather than
      # restating it here, so the gate cannot drift from the dependency it
      # guards. Prereleases must be enabled explicitly: every version in this
      # family is a `.devN`, which a default SpecifierSet excludes.
      - name: Verify installed ldpred3 satisfies the declared range
        run: |
          pip install packaging
          python - <<'PY'
          import ldpred3
          from importlib.metadata import requires, version
          from packaging.requirements import Requirement
          from packaging.specifiers import SpecifierSet

          spec = None
          for raw in requires("bipred") or ():
              req = Requirement(raw)
              if req.name == "ldpred3" and req.marker is None:
                  spec = SpecifierSet(str(req.specifier), prereleases=True)
                  break
          if spec is None:
              raise SystemExit("bipred declares no unconditional ldpred3 dependency")

          # Check the version that actually governs behaviour. For an editable
          # install of a dynamic-version package the recorded dist metadata is
          # whatever it was at install time and can lag the module by several
          # releases, so both are printed and the imported one decides.
          imported, recorded = ldpred3.__version__, version("ldpred3")
          print(f"ldpred3 imported {imported} (dist metadata {recorded});"
                f" bipred declares {spec}")
          if imported not in spec:
              raise SystemExit(
                  f"::error::ldpred3 {imported} is outside bipred's declared "
                  f"range '{spec}'. Either move the floor/ceiling in "
                  f"pyproject.toml, or pin LDPRED3_REV to a tag inside the range."
              )
          PY

      - name: Verify pure-NumPy fallback
        if: matrix.numba == 'no-numba'
        run: python -c "from bipred._ldpred3_compat import HAVE_NUMBA; assert not HAVE_NUMBA, 'Numba unexpectedly available in no-numba job'"

      - name: Smoke-test repository benchmark imports
        env:
          NB: "0"
        run: python -c "import benchmarks.infer_vs_ldsc_sbayes, benchmarks.rg_architectures"

      - name: Run tests
        run: pytest -q

  windows:
    runs-on: windows-latest
    name: windows / py3.14 / with-numba
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Authenticate to private ldpred3
        shell: bash
        env:
          TOKEN: ${{ secrets.LDPRED3_FOR_BIPRED || secrets.LDPRED3_TOKEN }}
        run: |
          # The guard lives in bash, not in an `if:` expression. A secret piped
          # through workflow-level `env` reads as empty to the expression
          # evaluator, so `if: env.LDPRED3_TOKEN != ''` skipped this step even
          # with the secret set -- and the only symptom was `could not read
          # Username` from a pip subprocess several steps later. Say it plainly
          # instead.
          if [ -z "$TOKEN" ]; then
            echo "::error::No ldpred3 token secret is set on this repository."
            echo "ldpred3 is private, so every install below will fail."
            echo "Add a token with read access to bvilhjal/ldpred3:"
            echo "  printf %s '<token>' | gh secret set LDPRED3_FOR_BIPRED --repo bvilhjal/bipred"
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          # Windows only in effect, harmless elsewhere. ldpred3's benchmark
          # archive carries a 187-character path
          # (benchmarks/results/<run>/source/<sha>/untracked/...), and pip clones
          # into a ~95-character temp directory, so checkout overruns MAX_PATH
          # and fails with "Filename too long" *after* a successful clone.
          git config --global core.longpaths true

      - name: Install ldpred3 and bipred with Numba
        run: |
          python -m pip install "ldpred3[fast] @ git+https://github.com/bvilhjal/ldpred3.git@${{ env.LDPRED3_REV }}"
          python -m pip install -e ".[test,fast]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test Windows peak RSS
        run: python -c "import sys; sys.path.insert(0, 'benchmarks'); from _benchmark_utils import peak_rss_bytes; assert peak_rss_bytes() > 0"

  build:
    runs-on: ubuntu-latest
    name: wheel / sdist smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Authenticate to private ldpred3
        shell: bash
        env:
          TOKEN: ${{ secrets.LDPRED3_FOR_BIPRED || secrets.LDPRED3_TOKEN }}
        run: |
          # The guard lives in bash, not in an `if:` expression. A secret piped
          # through workflow-level `env` reads as empty to the expression
          # evaluator, so `if: env.LDPRED3_TOKEN != ''` skipped this step even
          # with the secret set -- and the only symptom was `could not read
          # Username` from a pip subprocess several steps later. Say it plainly
          # instead.
          if [ -z "$TOKEN" ]; then
            echo "::error::No ldpred3 token secret is set on this repository."
            echo "ldpred3 is private, so every install below will fail."
            echo "Add a token with read access to bvilhjal/ldpred3:"
            echo "  printf %s '<token>' | gh secret set LDPRED3_FOR_BIPRED --repo bvilhjal/bipred"
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          # Windows only in effect, harmless elsewhere. ldpred3's benchmark
          # archive carries a 187-character path
          # (benchmarks/results/<run>/source/<sha>/untracked/...), and pip clones
          # into a ~95-character temp directory, so checkout overruns MAX_PATH
          # and fails with "Filename too long" *after* a successful clone.
          git config --global core.longpaths true

      - name: Build wheel and sdist
        run: |
          pip install "build>=1.2"
          python -m build

      - name: Check sdist contents
        run: |
          python - <<'PY'
          import glob
          import posixpath
          import re
          import tarfile

          required = {
              "CHANGELOG.md",
              "LICENSE",
              "README.md",
              "docs/algorithm.md",
              "docs/guide.md",
              "docs/rg.md",
              "examples/minimal.py",
          }
          archive, = glob.glob("dist/*.tar.gz")
          with tarfile.open(archive) as tf:
              names = {name.split("/", 1)[1] for name in tf.getnames() if "/" in name}
              markdown = {
                  name: tf.extractfile(member).read().decode()
                  for member in tf.getmembers()
                  if "/" in member.name
                  and (name := member.name.split("/", 1)[1]).endswith(".md")
              }
          missing = required - names
          if missing:
              raise SystemExit(f"sdist is missing: {sorted(missing)}")
          unexpected = sorted(name for name in names if name.startswith("benchmarks/"))
          if "tests/test_benchmark_simulate.py" in names:
              unexpected.append("tests/test_benchmark_simulate.py")
          if unexpected:
              raise SystemExit(
                  f"sdist contains repository-only benchmark material: {unexpected}"
              )
          broken = []
          for source, text in markdown.items():
              for target in re.findall(r"\[[^]]+\]\(([^)]+)\)", text):
                  target = target.split("#", 1)[0]
                  if not target or target.startswith(("http://", "https://", "mailto:")):
                      continue
                  resolved = posixpath.normpath(
                      posixpath.join(posixpath.dirname(source), target)
                  )
                  if resolved not in names:
                      broken.append(f"{source} -> {target}")
          if broken:
              raise SystemExit(f"broken relative links in sdist docs: {broken}")
          PY

      - name: Build a wheel from the sdist
        run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir "${RUNNER_TEMP}/sdist-wheel"

      - name: Install and import the built wheel
        run: |
          pip install "ldpred3 @ git+https://github.com/bvilhjal/ldpred3.git@${{ env.LDPRED3_REV }}"
          pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          python -c "import bipred; [getattr(bipred, name) for name in bipred.__all__]; print(bipred.__version__)"
