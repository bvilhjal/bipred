name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  # Weekly drift early-warning (the ldpred3-head leg below), plus manual runs.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

env:
  # ldpred3 is not published yet and bipred consumes an internal compatibility
  # seam. Keep CI reproducible instead of silently following its moving branch.
  LDPRED3_REV: "5436dcc8152531000b223c5088f726d588d8a8cd"
  LDPRED3_VERSION: "0.4.3"
  # ldpred3 lives in a private repo, so the runner's default GITHUB_TOKEN (scoped
  # to this repo only) cannot clone it. Provide a repo/organization secret
  # LDPRED3_TOKEN — a PAT or fine-grained token with read access to
  # bvilhjal/ldpred3 — and the "Authenticate to private ldpred3" steps below wire
  # it into git so `pip install git+https://…` succeeds. Without the secret those
  # steps no-op and the ldpred3 install fails exactly as before (nothing is worse).
  LDPRED3_TOKEN: ${{ secrets.LDPRED3_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    name: ruff (pyflakes)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Linting source files does not require importing or resolving ldpred3.
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: Lint (pyflakes-only; see [tool.ruff] in pyproject)
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
        numba: ["with-numba", "no-numba"]
    name: py${{ matrix.python-version }} / ${{ matrix.numba }}
    env:
      # Pin BLAS / OMP threads so numeric results are deterministic.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Rewrite github.com clones to carry the token so pip can reach the private
      # ldpred3 repo. No-op (and the install fails as before) when the secret is
      # unset. `git config --global` persists for the rest of the job.
      - name: Authenticate to private ldpred3
        if: env.LDPRED3_TOKEN != ''
        shell: bash
        run: |
          git config --global \
            url."https://x-access-token:${LDPRED3_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      # bipred depends on ldpred3, which is not on PyPI yet — install it from git
      # so the shared LD / sampler internals are importable.
      - name: Install ldpred3 (dependency, with Numba)
        if: matrix.numba == 'with-numba'
        run: pip install "ldpred3[fast] @ git+https://github.com/bvilhjal/ldpred3.git@${{ env.LDPRED3_REV }}"

      - name: Install ldpred3 (dependency, pure NumPy)
        if: matrix.numba == 'no-numba'
        run: |
          pip uninstall -y numba llvmlite
          pip install "ldpred3 @ git+https://github.com/bvilhjal/ldpred3.git@${{ env.LDPRED3_REV }}"

      - name: Install bipred (with Numba)
        if: matrix.numba == 'with-numba'
        run: pip install -e ".[test,fast]"

      - name: Install bipred (pure NumPy, no Numba)
        if: matrix.numba == 'no-numba'
        run: pip install -e ".[test]"

      - name: Verify pinned ldpred3 version
        run: python -c "import ldpred3; assert ldpred3.__version__ == '${{ env.LDPRED3_VERSION }}'"

      - name: Verify pure-NumPy fallback
        if: matrix.numba == 'no-numba'
        run: python -c "from bipred._ldpred3_compat import HAVE_NUMBA; assert not HAVE_NUMBA, 'Numba unexpectedly available in no-numba job'"

      - name: Smoke-test repository benchmark imports
        env:
          NB: "0"
        run: python -c "import benchmarks.infer_vs_ldsc_sbayes, benchmarks.rg_architectures"

      - name: Run tests
        run: pytest -q

  windows:
    runs-on: windows-latest
    name: windows / py3.14 / with-numba
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Authenticate to private ldpred3
        if: env.LDPRED3_TOKEN != ''
        shell: bash
        run: |
          git config --global \
            url."https://x-access-token:${LDPRED3_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install ldpred3 and bipred with Numba
        run: |
          python -m pip install "ldpred3[fast] @ git+https://github.com/bvilhjal/ldpred3.git@${{ env.LDPRED3_REV }}"
          python -m pip install -e ".[test,fast]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test Windows peak RSS
        run: python -c "import sys; sys.path.insert(0, 'benchmarks'); from _benchmark_utils import peak_rss_bytes; assert peak_rss_bytes() > 0"

  ldpred3-head:
    # Drift early-warning: run the suite against ldpred3's master instead of the
    # pinned LDPRED3_REV. Informational (continue-on-error): a failure means the
    # private seam drifted upstream and the next pin bump needs its audit, not
    # that this repo is broken at its pin. Scheduled weekly (see `on.schedule`)
    # and on demand; it does not run on pushes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    name: drift watch · ldpred3@master
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate to private ldpred3
        if: env.LDPRED3_TOKEN != ''
        shell: bash
        run: |
          git config --global \
            url."https://x-access-token:${LDPRED3_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install ldpred3 from master (not the pin)
        run: pip install "ldpred3[fast] @ git+https://github.com/bvilhjal/ldpred3.git@master"

      - name: Install bipred without re-resolving ldpred3
        # --no-deps is load-bearing. This leg deliberately installs an ldpred3
        # whose version differs from bipred's declared range, and ldpred3 is on
        # no package index, so letting pip re-resolve the dependency fails at
        # resolution and the leg never reaches pytest -- silently, because it is
        # continue-on-error. Install bipred's other runtime deps explicitly.
        run: |
          pip install "numpy>=1.20" "numba>=0.59" "pytest>=7"
          pip install -e . --no-deps

      - name: Report the ldpred3 under test
        # Recorded in the log so a drift failure names the version that caused
        # it, and so a run that silently fell back to the pin is visible.
        run: python -c "import ldpred3; print('ldpred3 under test:', ldpred3.__version__)"

      - name: Run tests against ldpred3@master
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    name: wheel / sdist smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Authenticate to private ldpred3
        if: env.LDPRED3_TOKEN != ''
        shell: bash
        run: |
          git config --global \
            url."https://x-access-token:${LDPRED3_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Build wheel and sdist
        run: |
          pip install "build>=1.2"
          python -m build

      - name: Check sdist contents
        run: |
          python - <<'PY'
          import glob
          import tarfile

          required = {
              "CHANGELOG.md",
              "LICENSE",
              "README.md",
              "docs/algorithm.md",
              "docs/guide.md",
              "docs/rg.md",
              "examples/minimal.py",
          }
          archive, = glob.glob("dist/*.tar.gz")
          with tarfile.open(archive) as tf:
              names = {name.split("/", 1)[1] for name in tf.getnames() if "/" in name}
          missing = required - names
          if missing:
              raise SystemExit(f"sdist is missing: {sorted(missing)}")
          unexpected = sorted(name for name in names if name.startswith("benchmarks/"))
          if "tests/test_benchmark_simulate.py" in names:
              unexpected.append("tests/test_benchmark_simulate.py")
          if unexpected:
              raise SystemExit(
                  f"sdist contains repository-only benchmark material: {unexpected}"
              )
          PY

      - name: Build a wheel from the sdist
        run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir "${RUNNER_TEMP}/sdist-wheel"

      - name: Install and import the built wheel
        run: |
          pip install "ldpred3 @ git+https://github.com/bvilhjal/ldpred3.git@${{ env.LDPRED3_REV }}"
          pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          python -c "import bipred; [getattr(bipred, name) for name in bipred.__all__]; print(bipred.__version__)"
